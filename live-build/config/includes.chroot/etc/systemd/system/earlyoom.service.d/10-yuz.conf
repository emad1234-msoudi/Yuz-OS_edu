# /etc/systemd/system/earlyoom.service.d/10-yuz.conf

[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom \
  -m 12,8 \
  -s 80,60 \
  --sort-by-rss \
  --prefer '^(firefox|firefox-esr|chromium|google-chrome|libreoffice|soffice|electron|java|zoom|teams|code)$' \
  --avoid '^(gnome-shell|mutter|Xorg|Xwayland|systemd|dbus-daemon|gnome-session-binary|pipewire|wireplumber|gdm|lightdm)$' \
  --ignore-root-user \
  -r 2 \
  -p \
  --syslog
