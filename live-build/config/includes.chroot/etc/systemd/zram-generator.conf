# /etc/systemd/zram-generator.conf

# Yuz-OS memory compression profile
# Target: low-resource school computers
# Architecture: x86_64
# Typical systems: 4 GiB and 8 GiB RAM
# Backend: systemd-zram-generator

# Balanced for 4 GiB school machines, still comfortable on 8 GiB systems.
[zram0]

# Create a compressed swap device with a size equal to physical RAM,
# but never larger than 8 GiB.
#
# This gives reasonable headroom on 4 GiB and 8 GiB systems without
# creating an unnecessarily huge virtual swap device.
zram-size = min(ram, 4096)

# zstd offers good compression while remaining widely available on
# modern Debian kernels.
#
# If testing shows that very old CPUs spend too much time compressing,
# use "lz4" instead.
compression-algorithm = lz4

# Prefer zram over any disk-backed swap device.
# A higher priority means that the kernel uses zram first.
swap-priority = 100
