# /etc/sysctl.d/99-yuz-memory.conf
#
# Yuz-OS Edu memory policy
# Balanced for 4 GiB school machines and still comfortable on 8 GiB systems.
# Goal: avoid HDD stalls and keep CPU pressure reasonable.

# Prefer reclaiming memory before falling into slow disk swap,
# but keep it a little less eager than 100 to avoid extra compression churn.
vm.swappiness = 80

# zram does not benefit from swap read-ahead the way HDD swap might.
vm.page-cluster = 0

# Keep dentry/inode cache reclaim balanced.
# Lower values can hold more cache, higher values reclaim more aggressively.
# 100 is the neutral, safe baseline.
vm.vfs_cache_pressure = 100

# Start writeback early so dirty pages don't accumulate into long UI stalls.
# This helps especially on HDD and slow SSD systems.
vm.dirty_background_bytes = 67108864

# Cap dirty memory to prevent huge writeback bursts that freeze the desktop.
vm.dirty_bytes = 268435456
