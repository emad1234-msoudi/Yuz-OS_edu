set default=0

# live-build places unicode.pf2 at /boot/grub/unicode.pf2.
# Avoid GRUB's default lookup path: /boot/grub/fonts/unicode.pf2.
set font="$prefix/unicode.pf2"

if loadfont "$font"; then
    # Prefer 800x600 for the live boot UX.
    # Keep a minimal fallback for environments that do not expose it.
    set gfxmode=800x600
    set gfxpayload=keep

    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod gfxmenu
insmod png

# Fonts referenced by live-theme/theme.txt.
loadfont "$prefix/live-theme/Poppins-14.pf2"
loadfont "$prefix/live-theme/Poppins-16.pf2"
loadfont "$prefix/live-theme/Poppins-18.pf2"

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
