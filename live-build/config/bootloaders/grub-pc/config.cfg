set default=0

function load_video {
    if [ x$feature_all_video_module = xy ]; then
        insmod all_video
    else
        insmod video_bochs
        insmod video_cirrus

        if [ "${grub_platform}" = "efi" ]; then
            insmod efi_gop
            insmod efi_uga
        elif [ "${grub_platform}" = "pc" ]; then
            insmod vbe
            insmod vga
        fi
    fi
}

if [ x$feature_default_font_path = xy ]; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont "$font"; then
    set gfxmode=1024x768,800x600,auto
    set gfxpayload=keep
    export gfxmode
    export gfxpayload

    load_video

    insmod gfxterm
    terminal_output gfxterm
    insmod png

    loadfont "$prefix/live-theme/Poppins-14.pf2"
    loadfont "$prefix/live-theme/Poppins-16.pf2"

    source /boot/grub/theme.cfg
else
    insmod all_video
    set gfxmode=auto
fi

insmod play
play 960 440 1 0 4 440 1

